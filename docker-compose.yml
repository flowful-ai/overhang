services:
  frontend:
    build: .
    restart: unless-stopped
    ports:
      # Host interface the app is published on. Loopback by default so other
      # machines can't hit port 3000 around the proxy. This does not protect a
      # public proxy port: see README "Running behind a proxy". Set FRONTEND_BIND=0.0.0.0
      # only if something outside this host must reach port 3000, and
      # firewall it to that proxy.
      - "${FRONTEND_BIND:-127.0.0.1}:3000:3000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CAD_WORKER_URL=http://cad-worker:8000
      # Shared secret with the cad-worker. Required so nothing else on
      # app-network can drive arbitrary Python execution.
      - WORKER_SECRET=${WORKER_SECRET:?WORKER_SECRET must be set (generate with openssl rand -hex 32)}
      # Number of trusted reverse proxies that append to X-Forwarded-For. Falls
      # back to 1 only when TRUST_PROXY is absent from the environment and
      # .env; .env.example sets 0 for local installs. A CDN in front of a
      # reverse proxy is 2. See README "Running behind a proxy".
      - TRUST_PROXY=${TRUST_PROXY:-1}
      # Trust CF-Connecting-IP. Only when the origin accepts Cloudflare alone
      # (firewalled to Cloudflare IP ranges, or Authenticated Origin Pulls).
      - TRUST_CF_CONNECTING_IP=${TRUST_CF_CONNECTING_IP:-}
      # Global concurrency caps per endpoint pool. Passed through raw; the app
      # owns precedence (new name if valid, else the pre-rename ANON_* name,
      # else 4) so existing deploys keep their settings. See src/lib/in-flight.ts.
      - MAX_CONCURRENT_GENERATIONS=${MAX_CONCURRENT_GENERATIONS:-}
      - MAX_CONCURRENT_RENDERS=${MAX_CONCURRENT_RENDERS:-}
      - ANON_MAX_CONCURRENT_GENERATIONS=${ANON_MAX_CONCURRENT_GENERATIONS:-}
      - ANON_MAX_CONCURRENT_RENDERS=${ANON_MAX_CONCURRENT_RENDERS:-}
      # Web search for the agent (OpenRouter). On when empty; off, 0 or false
      # disables it for everyone, whatever the users' toggle says.
      - WEB_SEARCH=${WEB_SEARCH:-}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    depends_on:
      cad-worker:
        condition: service_healthy
    networks:
      - app-network

  cad-worker:
    build:
      context: ./cad-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    # Port not exposed to host — frontend reaches worker via app-network
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://frontend:3000}
      - EXEC_TIMEOUT=${EXEC_TIMEOUT:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WORKER_SECRET=${WORKER_SECRET:?WORKER_SECRET must be set (generate with openssl rand -hex 32)}
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/appuser/.cache:size=64m,mode=1777
    stop_grace_period: 30s
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
